plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tabletmonitor'
    compileSdk 34

    defaultConfig {
        applicationId "com.tabletmonitor"
        minSdk 17
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
