name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "Usando $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: TabletMonitor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-pc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar librerias
        run: pip install mss pillow pystray pyinstaller

      - name: Crear el .exe
        run: |
          Copy-Item pc/tablet_monitor.pyw pc/tablet_monitor.py
          pyinstaller --onefile --noconsole --name TabletMonitor --hidden-import pystray._win32 pc/tablet_monitor.py

      - name: Descargar platform-tools (adb)
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath dist

      - uses: actions/upload-artifact@v4
        with:
          name: TabletMonitor-PC
          path: |
            dist/TabletMonitor.exe
            dist/platform-tools
